name: Prod deploy

on:
  push:
  pull_request:

jobs:
  # =========================================================================
  # 1. LINT & TYPECHECK
  # =========================================================================
  lint-typecheck:
    name: Lint (typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🗄️ Validate & Generate Prisma
        run: |
          npx prisma validate
          npx prisma generate

      - name: 🔍 ESLint check
        run: npm run lint

      - name: 🏷️ TypeScript type check
        run: npm run typecheck

  # =========================================================================
  # 2. UNIT TESTS
  # =========================================================================
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧪 Run Unit tests
        run: npm test

  # =========================================================================
  # 3. BUILD AND DEPLOY TO PROD
  # =========================================================================
  build-deploy:
    name: Build and deploy to prod
    needs: [lint-typecheck, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Expo Web App
        run: npm run build:web

      # Deploys to EC2 only when pushing or merging into the main branch
      - name: 🚀 Deploy to AWS EC2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "ℹ️ EC2_HOST or EC2_SSH_KEY secret not yet set in repository. Build succeeded, skipping remote deploy."
            exit 0
          fi
          
          echo "🔑 Configuring SSH key..."
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          
          echo "🌐 Connecting to $EC2_USER@$EC2_HOST:$EC2_PORT..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2.pem -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" 'bash -s' << 'EOF'
            if [ -d "$HOME/CT" ]; then
              cd "$HOME/CT"
            elif [ -d "/var/www/CT" ]; then
              cd "/var/www/CT"
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
          EOF

      - name: ℹ️ Skip EC2 Deploy on PR/Branches
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: echo "PR or feature branch detected. Build verification succeeded. EC2 deployment skipped."
